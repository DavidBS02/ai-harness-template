name: proceso
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  verificar:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - name: Rama, change de OpenSpec y riesgo
        id: base
        env:
          HARNESS_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          git fetch origin "$BASE"
          NIVEL=$(bash scripts/riesgo.sh "origin/$BASE" 2>/dev/null || echo medio)
          echo "nivel=$NIVEL" >> "$GITHUB_OUTPUT"
          ID=$(bash scripts/cambio.sh id); ISSUE=$(bash scripts/cambio.sh issue || true)
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          case "$HARNESS_BRANCH" in
            feat/*)
              bash scripts/cambio.sh propuesta >/dev/null || { echo "::error::Falta openspec/changes/$ID/proposal.md (o su archivo en archive/). El change lo abre Claude con /cambio."; exit 1; } ;;
            fix/*)
              if ! bash scripts/cambio.sh propuesta >/dev/null && [ "$NIVEL" != "bajo" ]; then
                echo "::error::fix/ sin change solo se permite con riesgo bajo (salió $NIVEL). Abre el change con /cambio."; exit 1; fi ;;
            chore/*|docs/*) ;;
            *) echo "::error::Rama '$HARNESS_BRANCH' fuera de convención: feat/<issue>-<change-id>, fix/<issue>-<change-id>, fix/<slug>, chore/..., docs/..."; exit 1 ;;
          esac
      - name: OpenSpec validate
        run: |
          if [ -d openspec ]; then
            V=$(node -p "try{require('./package.json').devDependencies['@fission-ai/openspec']||'latest'}catch(e){'latest'}" 2>/dev/null || echo latest)
            npx --yes "@fission-ai/openspec@$V" validate --all
          fi
      - name: Revisiones marcadas según riesgo
        uses: actions/github-script@v7
        env:
          NIVEL: ${{ steps.base.outputs.nivel }}
          ISSUE: ${{ steps.base.outputs.issue }}
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const nivel = process.env.NIVEL, issue = process.env.ISSUE;
            const marcado = (re) => new RegExp(`- \\[x\\][^\\n]*${re}`, "i").test(body);
            const errores = [];
            if (issue && !new RegExp(`#${issue}\\b`).test(body)) errores.push(`El PR debe enlazar el issue (#${issue}).`);
            if (!marcado("Revisión 1")) errores.push("Falta marcar Revisión 1 (@revisor-gratis).");
            if (["medio","alto"].includes(nivel) && !marcado("Revisión 2")) errores.push(`Riesgo ${nivel}: falta Revisión 2 (@revisor-fuerte).`);
            if (nivel === "alto" && !marcado("Revisión 3")) errores.push("Riesgo alto: falta Revisión 3 (/codex:review, Luna).");
            if (nivel === "alto" && !marcado("OK final")) errores.push("Riesgo alto: falta el OK final de Claude Code + lectura humana.");
            core.info(`riesgo=${nivel}`);
            if (errores.length) core.setFailed("⛔ Proceso del harness:\n- " + errores.join("\n- "));

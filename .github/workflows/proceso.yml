name: proceso
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  verificar:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - name: Nivel, change, issue y revisiones
        env:
          HARNESS_BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          printf '%s' "$BODY" > body.txt
          python3 scripts/harness.py proceso --base "origin/${{ github.base_ref }}" --body-file body.txt
      - name: Skills instaladas clasificadas
        run: python3 scripts/harness.py skills --check
      - name: Adaptadores al día con harness.json
        run: python3 scripts/harness.py sync --check
      - name: OpenSpec validate
        run: |
          if [ -d openspec ]; then
            V=$(node -p "try{require('./package.json').devDependencies['@fission-ai/openspec']||'latest'}catch(e){'latest'}" 2>/dev/null || echo latest)
            npx --yes "@fission-ai/openspec@$V" validate --all
          fi

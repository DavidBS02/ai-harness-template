name: riesgo
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
  contents: read
jobs:
  clasificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - id: r
        env:
          HARNESS_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch -q origin ${{ github.base_ref }}
          python3 scripts/harness.py nivel origin/${{ github.base_ref }} > nivel.json
          echo "riesgo=$(python3 -c 'import json;print(json.load(open("nivel.json"))["riesgo"]["riesgo"])')" >> "$GITHUB_OUTPUT"
          echo "nivel=$(python3 -c 'import json;print(json.load(open("nivel.json"))["nivel"])')" >> "$GITHUB_OUTPUT"
          { echo "detalle<<EOF"; python3 -c 'import json;print(json.load(open("nivel.json"))["riesgo"]["detalle"])'; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v9
        env:
          RIESGO: ${{ steps.r.outputs.riesgo }}
          NIVEL: ${{ steps.r.outputs.nivel }}
          DETALLE: ${{ steps.r.outputs.detalle }}
        with:
          script: |
            const r = process.env.RIESGO, n = process.env.NIVEL, d = process.env.DETALLE;
            const req = { bajo: 'Revisión 1 (si hay change) + CI', medio: 'Revisión 1 + Revisión 2 + CI', alto: 'Revisión 1 + 2 + 3 (Luna) + lectura humana + CI' }[r];
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            for (const l of ['riesgo:bajo','riesgo:medio','riesgo:alto']) { try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: l }); } catch {} }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [`riesgo:${r}`] });
            await github.rest.issues.createComment({ owner, repo, issue_number,
              body: `**Nivel ${n} · riesgo ${r}** — revisiones requeridas: ${req}\n\n<details><summary>detalle</summary>\n\n${d}\n</details>` });

# Base del harness para openspec/config.yaml.
# /init-harness la fusiona con el config.yaml del repo: conserva el `context` existente y añade las reglas marcadas [harness].
schema: spec-driven

context: |
  Language: spanish
  All artifacts must be written in spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Producto
  <qué es, para quién; contrato en _bmad-output/.../SPEC.md (CAP-*)>

  ## Stack
  <runtime, lenguaje, versiones fijadas, cómo se despliega>

  ## Capas y directorios
  <una línea por capa; qué depende de qué>

  ## Reglas de arquitectura
  <AD-* del spine: son contrato; cúmplelas, no las copies. Cambiar un AD pasa por bmad-architecture, no por un change.>

  ## Convenciones
  <idioma del código vs. textos al usuario, formatos, ids, comandos de test/build/deploy>

  ## Nunca entra al repo
  <secretos, ids reales, datos personales, archivos del usuario>

rules:
  proposal:
    - Citar los AD-* del spine que gobiernan el change y las capacidades de openspec/specs/ que crea o modifica.
    - Incluir una sección "Fuera de este change" con lo que queda para changes posteriores.
    - '[harness] Terminar con la sección "## Harness" con estas líneas exactas: "Issue: #<n>", "Riesgo: bajo|medio|alto" (criterio de docs/harness/MAPA.md: rojo = auth, dinero, datos personales, migraciones/esquema, infra, secretos o código crítico sin tests), "Zonas: <rutas o módulos que toca>", "OpenCode-zona-roja: autorizado" solo si el arquitecto delega zona roja con pasos cerrados (si no, "OpenCode-zona-roja: no").'
  specs:
    - Requirements y escenarios en español; SHALL/MUST y encabezados estructurales en inglés.
    - Todo encabezado bajo `## MODIFIED Requirements` debe existir literal en `openspec/specs/<cap>/spec.md` (grep y comparación carácter por carácter); un MODIFIED lleva todos los escenarios ya publicados del requisito (docs/LECCIONES.md §1).
    - Si cambia el nombre de un requisito, bloque `## RENAMED Requirements` y el MODIFIED apunta al header nuevo; si cambia el `## Purpose` de una capacidad publicada, editarlo a mano como tarea del change.
  design:
    - Toda decisión que dependa de un artefacto externo (correo, PDF, respuesta de API) cita la muestra real verificada o la declara Open Question con una tarea temprana que la resuelva (docs/LECCIONES.md §2).
    - Toda decisión que toque infraestructura externa dice qué puerto implementa y cuál es su doble en memoria para los tests.
  tasks:
    - Cada tarea termina con "verificar con ..." concreto (comando, test u observación).
    - Marcar "(manual)" las tareas que solo el usuario puede hacer en sus cuentas.
    - '[harness] Las tareas las marca el ejecutor (OpenCode) al completarlas; si una tarea revela un hueco del spec, el ejecutor lo escribe en HANDOFF.md y se detiene: el arquitecto corre /opsx:update.'
    - '[harness] La tarea de despliegue termina en el paso que cambia lo que se sirve, no en el que sube el código (docs/LECCIONES.md §4).'

operations:
  apply:
    guidance:
      - Correr typecheck y tests antes de marcar una tarea de código como hecha.
      - Si una tarea revela un ajuste al esquema, a la config o a un AD, pausar y dejarlo en HANDOFF.md para el arquitecto; no absorberlo en silencio.
      - '[harness] Nunca editar proposal.md, design.md ni specs/ del change: solo código y tasks.md.'
  archive:
    guidance:
      - Verificar que `npx openspec validate --all` pasa y resumir qué specs de openspec/specs/ cambiaron.
      - Revisar las 5 convenciones de deltas de docs/LECCIONES.md §1 antes de archivar.
      - Actualizar docs/ESTADO.md verificando cada deuda contra su archivo dueño, no contra la lista (docs/LECCIONES.md §3).
      - Si el change tocó algo que se sirve congelado, comprobar que el paso de publicación ocurrió después del último cambio de código (docs/LECCIONES.md §4).
